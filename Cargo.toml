[package]
name = "portable-app-manager"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
regex = "1"
url = "2"
percent-encoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
sevenz-rust = "0.6"
tar = "0.4"
rfd = "0.15"
open = "5"
pelite = "0.10"
image = { version = "0.25", default-features = false, features = ["ico", "png", "bmp", "jpeg"] }

[profile.release]
lto = true
strip = true
opt-level = "s"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "ico", "gif", "webp"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
