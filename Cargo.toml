[package]
name = "portable-app-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
regex = "1"
url = "2"
percent-encoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
rfd = "0.15"
open = "5"

[profile.release]
lto = true
strip = true
opt-level = "s"
